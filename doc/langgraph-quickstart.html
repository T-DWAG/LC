from typing_extensions import TypedDict, Annotated
import operator
from langgraph.graph import StateGraph, START, END

@tool
def add(a: int, b: int) -> int:
    """Adds a and b."""
    return a + b

def multiply(a: int, b: int) -> int:
    """Multiply a and b."""
    return a * b

model = ChatOpenAI(model="gpt-4o-mini", temperature=0).bind_tools(tools)

class MessagesState(TypedDict):
    messages: Annotated[list[AnyMessage], operator.add]
    llm_calls: int

def llm_call(state: MessagesState):
    return {
        "messages": [model.invoke(
            [SystemMessage(content="You perform arithmetic.")] + state["messages"]
        )],
        "llm_calls": state.get("llm_calls", 0) + 1,
    }

def tool_node(state: MessagesState):
    result = []
    for tc in state["messages"][-1].tool_calls:
        obs = tools_by_name[tc["name"]].invoke(tc["args"])
        result.append(ToolMessage(content=str(obs), tool_call_id=tc["id"]))
    return {"messages": result}

def should_continue(state: MessagesState) -> Literal["tool_node", "__end__"]:
    if state["messages"][-1].tool_calls:
        return "tool_node"
    return END

builder = StateGraph(MessagesState)
builder.add_node("llm_call", llm_call)
builder.add_node("tool_node", tool_node)
builder.add_edge(START, "llm_call")
builder.add_conditional_edges("llm_call", should_continue, ["tool_node", END])
builder.add_edge("tool_node", "llm_call")
agent = builder.compile()
out = agent.invoke({"messages": [HumanMessage(content="Add 3 and 4.")], "llm_calls": 0})
print(out["messages"][-1].content)`,

from langgraph.graph import END, START, StateGraph
from langgraph.types import Command, interrupt

class ApprovalState(TypedDict):
    action_details: str
    status: Optional[Literal["pending", "approved", "rejected"]]

def approval_node(state: ApprovalState) -> Command[Literal["proceed", "cancel"]]:
    decision = interrupt({

store = InMemoryStore()

def tool_names(out) -> set[str]:
    names = set()
    for m in out["messages"]:
        for tc in getattr(m, "tool_calls", None) or []:
            names.add(tc["name"])
    return names

# add_node / add_edge       ≈ AddLambdaNode / AddEdge
# add_conditional_edges     ≈ Branch
# InMemorySaver             ≈ Checkpoint
# interrupt + Command       ≈ 人工节点 / 恢复
# InMemoryStore             ≈ 外挂长期记忆
# Subgraph                  ≈ 子 Graph`,
  },
};

const PHASES = [
  {
    name: "会跑通",
    steps: [
      {
        id: "state",
        title: "State",
        desc: "TypedDict + reducer（add_messages）。",
        chips: [{ id: "messages_state", label: "MessagesState" }],
      },
      {
        arrow: "有状态就要有改它的节点",
        id: "node_edge",
        title: "Node + Edge",
        desc: "START → … → END 最小顺序图。",
      },
      {
        arrow: "需要工具回环时",
        id: "conditional",
        title: "条件边与循环",
        desc: "llm_call ⇄ tool_node（官方计算器）。",
        chips: [
          { id: "tools", label: "Tools" },
          { id: "tools", label: "bind_tools" },
        ],
        side: "<b>官方：</b>docs.langchain.com/oss/python/langgraph/quickstart Graph API。",
      },
      {
        arrow: "需要续聊 / 挂起时",
        id: "checkpointer",
        title: "Checkpointer",
        desc: "InMemorySaver + thread_id。",
      },
      {
        arrow: "写操作要人确认",
        id: "interrupt",
        title: "中断 interrupt",
        desc: "interrupt() + Command(resume)。",
        chips: [{ id: "compare", label: "Eino 对照" }],
      },
      {
        arrow: "做错要反悔 / 试另一条路",
        id: "time_travel",
        title: "时间旅行",
        desc: "history / replay / update_state fork。",
      },
    ],
  },
  {
    name: "上线与做大",
    steps: [
      {
        arrow: "要记住「这个人」而不只是「这场对话」",
        id: "store",
        title: "Store 长期记忆",
        desc: "InMemoryStore 跨 thread。",
      },
      {
        arrow: "UI 要边跑边显示 / 检测挂起",
        id: "streaming",
        title: "Streaming",
        desc: "stream / stream_events。",
      },
      {
        arrow: "单角色不够，要分工协作时",
        id: "subgraph",
        title: "Subgraph / 多 Agent",
        desc: "子图嵌套或 supervisor 路由。",
      },
      {
        arrow: "改动要有回归",
        id: "evals",
        title: "观测与 Evals",
        desc: "LangSmith + 断言评测。",
      },
    ],
  },
];

function renderFlow() {
  const root = document.getElementById("flow");
  let n = 0;
  root.innerHTML = PHASES.map(ph => {
    const body = ph.steps.map(s => {
      n += 1;
      const num = n;
      const arrow = s.arrow
        ? `<div class="arrow"><span class="line"></span><span class="why">↓ ${s.arrow}</span><span class="line"></span></div>`
        : "";
      const chips = (s.chips || [])
        .map(c => `<button class="chip" data-id="${c.id}" type="button">${c.label}</button>`)
        .join("");
      const side = s.side ? `<div class="side-note">${s.side}</div>` : "";
      return `${arrow}
        <div class="step-card" data-id="${s.id}">
          <div><span class="step-num">${num}</span><span class="step-title">${s.title}</span></div>
          <div class="step-desc">${s.desc}</div>
          ${chips ? `<div class="chips">${chips}</div>` : ""}
          ${side}
        </div>`;
    }).join("");
    return `<div class="phase">${ph.name}</div>${body}`;
  }).join("");

  root.querySelectorAll(".step-card").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.closest(".chip")) return;
      select(el.getAttribute("data-id"));
    });
  });
  root.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      select(el.getAttribute("data-id"));
    });
  });
}

function select(id) {
  const t = TOPICS[id];
  if (!t) return;
  document.getElementById("crumb").textContent = t.title;
  document.querySelectorAll(".step-card").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-id") === id);
  });
  document.querySelectorAll(".chip").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-id") === id);
  });
  const parent = PHASES.flatMap(p => p.steps)
    .find(s => s.id === id || (s.chips || []).some(c => c.id === id));
  if (parent) {
    document.querySelectorAll(".step-card").forEach(el => {
      if (el.getAttribute("data-id") === parent.id) el.classList.add("active");
    });
  }
  document.getElementById("detail").innerHTML = `
    <div class="badge">主链路实例</div>
    <h3>${t.title}</h3>
    <p class="lead">${t.lead}</p>
    <div class="one-liner">${t.one}</div>
    <div class="bridge">${t.bridge}</div>
    <pre>${esc(t.code)}</pre>
    <p class="note">${t.note}</p>
  `;
}
function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

renderFlow();
select("interrupt");

</script>
</body>
</html>
