from langchain_core.runnables import RunnableConfig
from langgraph.checkpoint.memory import InMemorySaver
from langgraph.graph import END, START, StateGraph
from langgraph.types import Command, interrupt

class ApprovalState(TypedDict):
    action_details: str
    status: Optional[Literal["pending", "approved", "rejected"]]

# interrupt 把问题抛给外面并停住；resume 的值变成 decision，
# Command(goto=...) 据此跳到 proceed 或 cancel，所以不用再加普通边。
def approval_node(state: ApprovalState) -> Command[Literal["proceed", "cancel"]]:
    decision = interrupt(
        {
            "question": "Do you approve of this action?",
            "details": state["action_details"],
        }
    )
    return Command(goto="proceed" if decision else "cancel")

def proceed_node(state: ApprovalState):
    return {"status": "approved"}

def cancel_node(state: ApprovalState):
    return {"status": "rejected"}

# interrupt 必须有 checkpointer；InMemorySaver 按 thread_id 分开每一单
graph = (
    StateGraph(ApprovalState)
    .add_node("approval", approval_node)
    .add_node("proceed", proceed_node)
    .add_node("cancel", cancel_node)
    .add_edge(START, "approval")
    .add_edge("proceed", END)
    .add_edge("cancel", END)
    .compile(checkpointer=InMemorySaver())
)

approved = graph.invoke(Command(resume=True), cfg)  # 同 thread 恢复
print("after approve:", approved["status"])

rejected = graph.invoke(Command(resume=False), cfg2)

  },
  "evals": {
    title: "⑩ 观测与 Evals",
    lead: "LangSmith 看每次 trace；再用固定用例断言 tool 是否该调——防止改边/改 Prompt 越改越坏。",
    one: "<b>相对⑧：</b>stream 看单次体验；eval 看整体有没有退步。",
    bridge: "LangSmith dataset 或自建 pytest 都行。",
    note: "没有 eval，Agent 优化全凭感觉。",
    code: `import os
os.environ.setdefault("LANGCHAIN_TRACING_V2", "true")
# LANGCHAIN_API_KEY / LANGCHAIN_PROJECT 配好即可自动上报

cases = [
    {"q": "3+4 等于几？", "must_call": "add"},
    {"q": "你们公司叫什么？", "must_not_call": "add"},
]

def tool_names(out) -> set[str]:
    names = set()
    for m in out["messages"]:
        for tc in getattr(m, "tool_calls", None) or []:
            names.add(tc["name"])
    return names

def run_eval(agent):
    for c in cases:
        out = agent.invoke(
            {"messages": [("user", c["q"])], "llm_calls": 0},
            {"configurable": {"thread_id": f"eval-{c['q'][:8]}"}},
        )
        names = tool_names(out)
        if c.get("must_call"):
            assert c["must_call"] in names, c
        if c.get("must_not_call"):
            assert c["must_not_call"] not in names, c
    print("eval ok")`,
  },
  "compare": {
    title: "和 Eino 怎么对应",
    lead: "同一条主链路，两边换皮：StateGraph ≈ Eino Graph，interrupt ≈ 人工节点。",
    one: "<b>迁移顺序：</b>①③④⑤ 对齐后，再搬 Store / 子图。",
    bridge: "<strong>Eino 经历</strong> = Go Agent / 云原生编排加分。",
    note: "找工作主推 Python + LangGraph；对照表心里有数即可。",
    code: `# State / MessagesState     ≈ Eino Graph State
# add_node / add_edge       ≈ AddLambdaNode / AddEdge
# add_conditional_edges     ≈ Branch
# InMemorySaver             ≈ Checkpoint
# interrupt + Command       ≈ 人工节点 / 恢复
# InMemoryStore             ≈ 外挂长期记忆
# Subgraph                  ≈ 子 Graph`,
  },
};

const PHASES = [
  {
    name: "会跑通",
    steps: [
      {
        id: "state",
        title: "State",
        desc: "TypedDict + reducer（add_messages）。",
        chips: [{ id: "messages_state", label: "MessagesState" }],
      },
      {
        arrow: "有状态就要有改它的节点",
        id: "node_edge",
        title: "Node + Edge",
        desc: "START → … → END 顺序图（s05）。",
      },
      {
        arrow: "需要工具回环时",
        id: "conditional",
        title: "条件边与循环",
        desc: "llm_call ⇄ tools（计算器 Agent）。",
        chips: [
          { id: "tools", label: "Tools" },
          { id: "tools", label: "bind_tools" },
        ],
        side: "<b>代码：</b>code/s06_calc_agent.py（ToolNode + tools_condition）。",
      },
      {
        arrow: "需要续聊 / 挂起时",
        id: "checkpointer",
        title: "Checkpointer",
        desc: "InMemorySaver + thread_id。",
      },
      {
        arrow: "写操作要人确认",
        id: "interrupt",
        title: "中断 interrupt",
        desc: "interrupt() + Command(resume)。",
        chips: [{ id: "compare", label: "Eino 对照" }],
      },
      {
        arrow: "做错要反悔 / 试另一条路",
        id: "time_travel",
        title: "时间旅行",
        desc: "history / replay / update_state fork。",
      },
    ],
  },
  {
    name: "上线与做大",
    steps: [
      {
        arrow: "要记住「这个人」而不只是「这场对话」",
        id: "store",
        title: "Store 长期记忆",
        desc: "InMemoryStore 跨 thread。",
      },
      {
        arrow: "UI 要边跑边显示 / 检测挂起",
        id: "streaming",
        title: "Streaming",
        desc: "stream / stream_events。",
      },
      {
        arrow: "单角色不够，要分工协作时",
        id: "subgraph",
        title: "Subgraph / 多 Agent",
        desc: "子图嵌套或 supervisor 路由。",
      },
      {
        arrow: "改动要有回归",
        id: "evals",
        title: "观测与 Evals",
        desc: "LangSmith + 断言评测。",
      },
    ],
  },
];

function renderFlow() {
  const root = document.getElementById("flow");
  let n = 0;
  root.innerHTML = PHASES.map(ph => {
    const body = ph.steps.map(s => {
      n += 1;
      const num = n;
      const arrow = s.arrow
        ? `<div class="arrow"><span class="line"></span><span class="why">↓ ${s.arrow}</span><span class="line"></span></div>`
        : "";
      const chips = (s.chips || [])
        .map(c => `<button class="chip" data-id="${c.id}" type="button">${c.label}</button>`)
        .join("");
      const side = s.side ? `<div class="side-note">${s.side}</div>` : "";
      return `${arrow}
        <div class="step-card" data-id="${s.id}">
          <div><span class="step-num">${num}</span><span class="step-title">${s.title}</span></div>
          <div class="step-desc">${s.desc}</div>
          ${chips ? `<div class="chips">${chips}</div>` : ""}
          ${side}
        </div>`;
    }).join("");
    return `<div class="phase">${ph.name}</div>${body}`;
  }).join("");

  root.querySelectorAll(".step-card").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.closest(".chip")) return;
      select(el.getAttribute("data-id"));
    });
  });
  root.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      select(el.getAttribute("data-id"));
    });
  });
}

function select(id) {
  const t = TOPICS[id];
  if (!t) return;
  document.getElementById("crumb").textContent = t.title;
  document.querySelectorAll(".step-card").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-id") === id);
  });
  document.querySelectorAll(".chip").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-id") === id);
  });
  const parent = PHASES.flatMap(p => p.steps)
    .find(s => s.id === id || (s.chips || []).some(c => c.id === id));
  if (parent) {
    document.querySelectorAll(".step-card").forEach(el => {
      if (el.getAttribute("data-id") === parent.id) el.classList.add("active");
    });
  }
  document.getElementById("detail").innerHTML = `
    <div class="badge">主链路实例</div>
    <h3>${t.title}</h3>
    <p class="lead">${t.lead}</p>
    <div class="one-liner">${t.one}</div>
    <div class="bridge">${t.bridge}</div>
    <pre>${esc(t.code)}</pre>
    <p class="note">${t.note}</p>
  `;
}
function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

renderFlow();
select("interrupt");

</script>
