"""
import os

from dotenv import load_dotenv
from langchain_openai import ChatOpenAI
from langgraph.graph import END, START, StateGraph
from pydantic import SecretStr
from typing_extensions import NotRequired, TypedDict

load_dotenv(override=True)  # 项目 .env 覆盖系统里已有的同名变量


def make_llm(*, temperature: float = 0.0) -> ChatOpenAI:
    return ChatOpenAI(
        model=os.environ["OPENAI_MODEL"],
        api_key=SecretStr(os.environ["OPENAI_API_KEY"]),
        base_url=os.environ["OPENAI_BASE_URL"],
        temperature=temperature,
    )


class State(TypedDict):
    topic: NotRequired[str]
    joke: NotRequired[str]
    polished: NotRequired[str]


def as_text(content: str | list[str | dict]) -> str:
    if not isinstance(content, str):
        raise TypeError(f"expected str, got {type(content).__name__}")
    return content.strip()


llm = make_llm()


def generate_topic(state: State) -> State:
    return {"topic": state.get("topic") or "socks in the dryer"}


def write_joke(state: State) -> State:
    topic = state.get("topic")
    if not topic:
        raise ValueError("topic is not set")
    msg = llm.invoke(f"Write a one-line joke about {topic}. Reply with the joke only.")
    return {"joke": as_text(msg.content)}


def polish(state: State) -> State:
    joke = state.get("joke")
    if not joke:
        raise ValueError("joke is not set")
    msg = llm.invoke(
        "Rewrite this joke so it is shorter and funnier. Reply with the joke only.\\n" + joke
    )
    return {"polished": as_text(msg.content)}


graph = StateGraph(State)
graph.add_node("generate_topic", generate_topic)
graph.add_node("write_joke", write_joke)
graph.add_node("polish", polish)
graph.add_edge(START, "generate_topic")
graph.add_edge("generate_topic", "write_joke")
graph.add_edge("write_joke", "polish")
graph.add_edge("polish", END)

result = graph.compile().invoke({"topic": "电梯里的陌生人"})
print("topic:", result["topic"])
print("joke:", result["joke"])
print("polished:", result["polished"])

from langchain_core.messages import AnyMessage, HumanMessage, SystemMessage
from langchain_core.tools import tool
from langchain_openai import ChatOpenAI
from langgraph.graph import START, StateGraph

def make_llm(*, temperature: float = 0.0) -> ChatOpenAI:
    return ChatOpenAI(

        api_key=SecretStr(os.environ["OPENAI_API_KEY"]),

@tool
def add(a: int, b: int) -> int:
    """add a and b"""
    return a + b


@tool

    """multiply a and b"""
    return a * b


@tool

    """divide a by b"""
    return a / b

对应 code/s08_hitl.py
用 invoke；中断载荷在 result["__interrupt__"]
"""
from typing import Literal, Optional, TypedDict

from langchain_core.runnables import RunnableConfig
from langgraph.checkpoint.memory import InMemorySaver
from langgraph.graph import END, START, StateGraph
from langgraph.types import Command, interrupt


# 审批状态：action_details 是待审的动作，status 是还在等、已通过、还是已拒绝。
class ApprovalState(TypedDict):
    action_details: str
    status: Optional[Literal["pending", "approved", "rejected"]]


# 审批节点。interrupt 把问题抛给外面并停住当前这轮。
# 同一个 thread 再次 invoke(Command(resume=...)) 时，resume 的值变成 decision。
# Command(goto=...) 按这个值跳到 proceed 或 cancel，所以这里不用再加普通边。
def approval_node(state: ApprovalState) -> Command[Literal["proceed", "cancel"]]:
    decision = interrupt(
        {
            "question": "Do you approve of this action?",
            "details": state["action_details"],
        }
    )
    return Command(goto="proceed" if decision else "cancel")


def proceed_node(state: ApprovalState):
    return {"status": "approved"}


def cancel_node(state: ApprovalState):
    return {"status": "rejected"}


# interrupt 必须有 checkpointer，挂起的位置才有地方记下来。
# InMemorySaver 只存在当前进程里，按 thread_id 分开每一单。
graph = (
    StateGraph(ApprovalState)
    .add_node("approval", approval_node)
    .add_node("proceed", proceed_node)
    .add_node("cancel", cancel_node)
    .add_edge(START, "approval")
    .add_edge("proceed", END)
    .add_edge("cancel", END)
    .compile(checkpointer=InMemorySaver())
)


# 第一单：转账。第一次 invoke 停在 approval，结果里有 __interrupt__，status 还是 pending。
cfg: RunnableConfig = {"configurable": {"thread_id": "123"}}
paused = graph.invoke(
    {"action_details": "Transfer $500", "status": "pending"},
    config=cfg,
)
print("interrupt", paused.get("__interrupt__"))

# 同一个 thread_id 恢复。resume=True 传回 interrupt()，于是走进 proceed。
approved = graph.invoke(Command(resume=True), cfg)
print("after approve:", approved["status"])

# 第二单用另一个 thread_id，和上面那单的存档互不影响。
cfg2: RunnableConfig = {"configurable": {"thread_id": "456"}}
graph.invoke({"action_details": "Delete DB", "status": "pending"}, cfg2)
# resume=False 传回 interrupt()，于是走进 cancel。
rejected = graph.invoke(Command(resume=False), cfg2)
print("after reject:", rejected["status"])

    code: `"""实例 E：时间旅行（replay + fork）
对齐：docs.langchain.com/oss/python/langgraph/use-time-travel
"""
from typing_extensions import TypedDict, NotRequired
from langgraph.graph import StateGraph, START
from langgraph.checkpoint.memory import InMemorySaver


class State(TypedDict):
    topic: NotRequired[str]
    joke: NotRequired[str]


def generate_topic(state: State):
    return {"topic": "socks in the dryer"}


def write_joke(state: State):
    return {"joke": f"Why do {state['topic']} disappear? They elope!"}


checkpointer = InMemorySaver()
graph = (
    StateGraph(State)
    .add_node("generate_topic", generate_topic)
    .add_node("write_joke", write_joke)
    .add_edge(START, "generate_topic")
    .add_edge("generate_topic", "write_joke")
    .compile(checkpointer=checkpointer)
)

cfg = {"configurable": {"thread_id": "tt-demo"}}
result = graph.invoke({}, cfg)
print("original:", result)

history = list(graph.get_state_history(cfg))
for s in history:
    print(" next=", s.next, "id=", s.config["configurable"].get("checkpoint_id"))

before_joke = next(s for s in history if s.next == ("write_joke",))

# Replay：从 write_joke 前再执行（节点会重跑）
replay_result = graph.invoke(None, before_joke.config)
print("replay:", replay_result)

# Fork：改 topic 再继续
fork_config = graph.update_state(
    before_joke.config,
    values={"topic": "chickens"},
)
fork_result = graph.invoke(None, fork_config)
print("fork:", fork_result)

print("""
注意：若图里有 interrupt()，时间旅行重放该节点时会再次挂起，
需要新的 Command(resume=...) 才能继续。
""")

对齐：docs.langchain.com/oss/python/langgraph/stores

"""
from typing import Annotated
from typing_extensions import TypedDict
from uuid import uuid4
from langgraph.checkpoint.memory import InMemorySaver
from langgraph.store.memory import InMemoryStore
from langgraph.graph import StateGraph, START, END
from langgraph.graph.message import add_messages
from langchain_core.messages import AIMessage, HumanMessage


class State(TypedDict):
    messages: Annotated[list, add_messages]
    user_id: str


store = InMemoryStore()
checkpointer = InMemorySaver()


def save_and_recall(state: State):
    ns = (state["user_id"], "memories")
    # 从最近一条用户消息里「记住」一句（演示）
    user_text = ""
    for m in reversed(state["messages"]):
        if isinstance(m, HumanMessage):
            user_text = m.content
            break
    if "喜欢" in user_text or "like" in user_text.lower():
        store.put(ns, str(uuid4()), {"note": user_text})
    hits = store.search(ns, limit=5)
    notes = [h.value.get("note", str(h.value)) for h in hits]
    reply = "已存偏好。" if notes else "还没有记忆。"
    if notes:
        reply += " 当前记忆：" + " | ".join(notes)
    return {"messages": [AIMessage(content=reply)]}


g = StateGraph(State)
g.add_node("mem", save_and_recall)
g.add_edge(START, "mem")
g.add_edge("mem", END)
app = g.compile(checkpointer=checkpointer, store=store)

uid = "user-42"
# 对话 1
app.invoke(
    {"messages": [HumanMessage(content="我喜欢吃火锅")], "user_id": uid},
    {"configurable": {"thread_id": "thread-1"}},
)
# 对话 2（不同 thread，同一 user）
out = app.invoke(
    {"messages": [HumanMessage(content="你还记得我吗？")], "user_id": uid},
    {"configurable": {"thread_id": "thread-2"}},
)
print(out["messages"][-1].content)
print("raw store:", [i.value for i in store.search((uid, "memories"))])

    flow: "<b>START</b> → fanout → (branch_b ‖ branch_c) → join → END；vals 用 Annotated[list, operator.add] 合并",
    combo: ["并行边", "operator.add", "reducer"],
    code: `"""实例 G：并行分支 + reducer
对齐：docs.langchain.com/oss/python/langgraph/use-graph-api 并行思路
"""
import operator
from typing import Annotated
from typing_extensions import TypedDict
from langgraph.graph import StateGraph, START, END


class State(TypedDict):
    vals: Annotated[list[str], operator.add]


def fanout(state: State):
    return {"vals": ["start"]}


def branch_b(state: State):
    return {"vals": ["B"]}


def branch_c(state: State):
    return {"vals": ["C"]}


def join(state: State):
    return {"vals": [f"joined:{','.join(state['vals'])}"]}


builder = StateGraph(State)
builder.add_node("fanout", fanout)
builder.add_node("branch_b", branch_b)
builder.add_node("branch_c", branch_c)
builder.add_node("join", join)
builder.add_edge(START, "fanout")
builder.add_edge("fanout", "branch_b")
builder.add_edge("fanout", "branch_c")
builder.add_edge("branch_b", "join")
builder.add_edge("branch_c", "join")
builder.add_edge("join", END)
graph = builder.compile()

print(graph.invoke({"vals": []}))
`,
  },
];

const nav = document.getElementById("nav");
const main = document.getElementById("main");

function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function show(id) {
  const r = RECIPES.find(x => x.id === id);
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  main.innerHTML = `
    <div class="n" style="font-size:11px;font-weight:700;color:var(--accent)">${r.n}</div>
    <h2>${r.title}</h2>
    <p class="lead">${r.lead}</p>
    <div class="combo">${r.combo.map(c => `<span>${c}</span>`).join("")}</div>
    <div class="flow">${r.flow}</div>
    <div class="bridge">${r.bridge}</div>
    <div class="toolbar">
      <button type="button" id="copy">复制代码</button>
      <span class="ok" id="ok">已复制</span>
    </div>
    <pre id="code">${esc(r.code)}</pre>
    <p class="run">${r.run}</p>
  `;
  document.getElementById("copy").onclick = async () => {
    await navigator.clipboard.writeText(r.code);
    const ok = document.getElementById("ok");
    ok.classList.add("show");
    setTimeout(() => ok.classList.remove("show"), 1200);
  };
}

nav.innerHTML = RECIPES.map(r => `
  <button type="button" data-id="${r.id}">
    <span class="n">${r.n}</span>
    <span class="t">${r.title}</span>
    <span class="s">${r.sub}</span>
  </button>
`).join("");
nav.querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.id));
show("r2");

</script>
