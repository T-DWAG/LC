from langchain_core.messages import AIMessage, HumanMessage, SystemMessage
from langchain_core.tools import tool
from langchain_openai import ChatOpenAI
from langgraph.checkpoint.memory import MemorySaver
from langgraph.graph import END, START, StateGraph

@tool
def order_status(order_id: str) -> str:
    """根据订单号查询物流状态。"""
    db = {"A100": "已发货，预计明天到", "B200": "运输中，今日达"}

    if isinstance(last, AIMessage) and last.tool_calls:
        return "tools"
    return "end"

概念组合：Checkpointer 上的 interrupt / resume / history
"""
from typing import Annotated, TypedDict
from langchain_core.messages import AIMessage, HumanMessage
from langgraph.checkpoint.memory import MemorySaver
from langgraph.graph import END, START, StateGraph
from langgraph.graph.message import add_messages
from langgraph.types import Command, interrupt


class State(TypedDict):
    messages: Annotated[list, add_messages]
    draft: str
    approved: bool


def draft_reply(state: State):
    """节点 1：生成待发送草稿（演示里写死，真实项目可换 LLM）。"""
    user = next(
        (m.content for m in reversed(state["messages"]) if isinstance(m, HumanMessage)),
        "",
    )
    draft = f"【待发送】已收到：「{user}」。我们会在 1 个工作日内处理。"
    return {
        "draft": draft,
        "messages": [AIMessage(content=f"已生成草稿：{draft}")],
    }


def human_approve(state: State):
    """节点 2：中断，把草稿抛给外部；resume 的值写回状态。"""
    decision = interrupt({
        "action": "approve_send",
        "draft": state["draft"],
        "hint": "resume 时传入 True 发送 / False 拒绝",
    })
    # decision = Command(resume=...) 里带来的值
    ok = bool(decision)
    msg = "已发送。" if ok else "已取消发送。"
    return {
        "approved": ok,
        "messages": [AIMessage(content=msg)],
    }


g = StateGraph(State)
g.add_node("draft", draft_reply)
g.add_node("approve", human_approve)
g.add_edge(START, "draft")
g.add_edge("draft", "approve")
g.add_edge("approve", END)

app = g.compile(checkpointer=MemorySaver())
cfg = {"configurable": {"thread_id": "hitl-1"}}


# ---------- 1) 跑到中断 ----------
paused = app.invoke(
    {"messages": [HumanMessage(content="我的退货到哪了？")], "draft": "", "approved": False},

    print("回退后另选拒绝:")
    print("  approved =", branched["approved"])
    print("  最后消息 =", branched["messages"][-1].content)

2. 恢复用 Command(resume=值)，值会成为 interrupt() 的返回值
3. get_state_history + 带 checkpoint_id 的 config = 回退 / 分支
""")`

const main = document.getElementById("main");

function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function show(id) {
  const r = RECIPES.find(x => x.id === id);
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  main.innerHTML = `
    <div class="n" style="font-size:11px;font-weight:700;color:var(--accent)">${r.n}</div>
    <h2>${r.title}</h2>
    <p class="lead">${r.lead}</p>
    <div class="combo">${r.combo.map(c => `<span>${c}</span>`).join("")}</div>
    <div class="flow">${r.flow}</div>
    <div class="bridge">${r.bridge}</div>
    <div class="toolbar">
      <button type="button" id="copy">复制代码</button>
      <span class="ok" id="ok">已复制</span>
    </div>
    <pre id="code">${esc(r.code)}</pre>
    <p class="run">${r.run}</p>
  `;
  document.getElementById("copy").onclick = async () => {
    await navigator.clipboard.writeText(r.code);
    const ok = document.getElementById("ok");
    ok.classList.add("show");
    setTimeout(() => ok.classList.remove("show"), 1200);
  };
}

nav.innerHTML = RECIPES.map(r => `
  <button type="button" data-id="${r.id}">
    <span class="n">${r.n}</span>
    <span class="t">${r.title}</span>
    <span class="s">${r.sub}</span>
  </button>
`).join("");
nav.querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.id));
show("r1");
</script>
</body>
</html>
