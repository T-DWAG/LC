<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LangChain 主链路</title>
<style>
  :root {
    --bg: #fafafa; --panel: #fff; --ink: #171717; --muted: #737373;
    --line: #ececec; --accent: #2563eb; --accent-soft: #eff6ff; --soft: #f5f5f5;
    --code-bg: #111827; --code-ink: #e5e7eb; --green: #047857;
    font-family: "PingFang SC", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh; }
  header { padding: 18px 24px 8px; }
  header h1 { font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
  header p { margin-top: 4px; font-size: 13px; color: var(--muted); max-width: 56em; line-height: 1.5; }
  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 0.92fr) minmax(360px, 1.08fr);
    gap: 14px; padding: 10px 18px 20px;
    height: calc(100vh - 78px); min-height: 580px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .panel-hd {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted); font-weight: 600;
    display: flex; justify-content: space-between;
  }
  .flow { flex: 1; overflow: auto; padding: 18px 24px 28px; }
  .phase {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    color: #a3a3a3; text-transform: uppercase; margin: 14px 0 8px;
  }
  .phase:first-child { margin-top: 0; }
  .step-card {
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
    padding: 12px 14px 11px; cursor: pointer;
    transition: border-color .12s, box-shadow .12s, background .12s;
  }
  .step-card:hover { border-color: #bfdbfe; background: #f8fbff; }
  .step-card.active {
    border-color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  .step-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 999px;
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: #fff; border: 1px solid #bfdbfe; margin-right: 8px;
  }
  .step-card.active .step-num { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step-title { font-size: 13.5px; font-weight: 650; }
  .step-desc { margin-top: 5px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 11.5px; padding: 4px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer; font-weight: 500;
  }
  .chip:hover { border-color: #93c5fd; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .arrow {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 0; font-size: 11px; font-weight: 600; gap: 2px;
  }
  .arrow .line { width: 1px; height: 10px; background: #d4d4d4; }
  .arrow .why {
    color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 650;
    text-align: center; max-width: 92%;
  }
  .side-note {
    margin-top: 8px; padding: 7px 9px; border-radius: 8px;
    background: var(--soft); font-size: 11.5px; color: #525252;
  }
  .side-note b { color: var(--green); font-weight: 650; }
  .detail { flex: 1; overflow: auto; padding: 18px 20px 24px; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 650;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 3px 10px; margin-bottom: 8px;
  }
  .detail h3 { font-size: 18px; font-weight: 650; letter-spacing: -.02em; margin-bottom: 6px; }
  .detail .lead { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.55; }
  .bridge {
    border-left: 3px solid #6ee7b7; padding-left: 10px;
    font-size: 12.5px; color: #404040; margin-bottom: 14px; line-height: 1.5;
  }
  .bridge strong { color: var(--green); }
  .one-liner {
    font-size: 13px; padding: 10px 12px; border-radius: 10px;
    background: #f5f5f5; margin-bottom: 14px; line-height: 1.5;
  }
  .one-liner b { font-weight: 650; }
  pre {
    background: var(--code-bg); color: var(--code-ink); border-radius: 10px;
    padding: 13px 14px; overflow: auto; font-size: 12.2px; line-height: 1.55;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin-bottom: 12px;
  }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; height: auto; } }
</style>
</head>

def run_eval(app):

        id: "agent",
        title: "Agent（工具循环）",
        desc: "Model ⇄ Tools。",
        chips: [{ id: "tools", label: "Tools" }],
      },
      {
        arrow: "需要分支 / 回环 / 人机时",
        id: "graph",
        title: "LangGraph",
        desc: "显式状态图。",
        chips: [{ id: "compare", label: "Eino 对照" }],
      },
      {
        arrow: "需要续聊 / 挂起时",
        id: "memory",
        title: "Checkpointer",
        desc: "线程级短状态持久化。",
      },
      {
        arrow: "写操作要确认 / 做错要反悔",
        id: "hitl",
        title: "中断 + 回退",
        desc: "interrupt · resume · 时间旅行。",
      },
    ],
  },
  {
    name: "上线与做大",
    steps: [
      {
        arrow: "要记住「这个人」而不只是「这场对话」",
        id: "long_memory",
        title: "长期记忆 Store",
        desc: "跨 thread 的偏好 / 画像。",
      },
      {
        arrow: "线上必须能复盘每一次调用",
        id: "observe",
        title: "观测 / LangSmith",
        desc: "Trace：链、工具、延迟、token。",

      {
        arrow: "单角色不够，要分工协作时",
        id: "multi_agent",
        title: "多 Agent / Subgraph",
        desc: "Supervisor 路由或子图嵌套。",

      {
        arrow: "改动要有回归，不能凭感觉",

        title: "评测 Evals",
        desc: "固定集断言，防止越改越坏。",
      },
    ],
  },
];

function renderFlow() {
  const root = document.getElementById("flow");
  let n = 0;
  root.innerHTML = PHASES.map(ph => {
    const body = ph.steps.map(s => {
      n += 1;
      const num = n;
      const arrow = s.arrow
        ? `<div class="arrow"><span class="line"></span><span class="why">↓ ${s.arrow}</span><span class="line"></span></div>`
        : "";
      const chips = (s.chips || [])
        .map(c => `<button class="chip" data-id="${c.id}" type="button">${c.label}</button>`)
        .join("");
      const side = s.side ? `<div class="side-note">${s.side}</div>` : "";
      return `${arrow}
        <div class="step-card" data-id="${s.id}">
          <div><span class="step-num">${num}</span><span class="step-title">${s.title}</span></div>
          <div class="step-desc">${s.desc}</div>
          ${chips ? `<div class="chips">${chips}</div>` : ""}
          ${side}
        </div>`;
    }).join("");
    return `<div class="phase">${ph.name}</div>${body}`;
  }).join("");

  root.querySelectorAll(".step-card").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.closest(".chip")) return;
      select(el.getAttribute("data-id"));
    });
  });
  root.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      select(el.getAttribute("data-id"));
    });
  });
}

function select(id) {
  const t = TOPICS[id];
  if (!t) return;
  document.getElementById("crumb").textContent = t.title;
  document.querySelectorAll(".step-card").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-id") === id);
  });
  document.querySelectorAll(".chip").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-id") === id);
  });
  const parent = PHASES.flatMap(p => p.steps)
    .find(s => s.id === id || (s.chips || []).some(c => c.id === id));
  if (parent) {
    document.querySelectorAll(".step-card").forEach(el => {
      if (el.getAttribute("data-id") === parent.id) el.classList.add("active");
    });
  }
  document.getElementById("detail").innerHTML = `
    <div class="badge">主链路实例</div>
    <h3>${t.title}</h3>
    <p class="lead">${t.lead}</p>
    <div class="one-liner">${t.one}</div>
    <div class="bridge">${t.bridge}</div>
    <pre>${esc(t.code)}</pre>
    <p class="note">${t.note}</p>
  `;
}
function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

renderFlow();
select("long_memory");
</script>
